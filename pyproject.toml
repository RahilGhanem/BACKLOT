[project]
name = "backlot"
version = "0.1.0"
description = "BACKLOT — an autonomous pre-production crew (Agentic Cinema hackathon)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backlot*"]
